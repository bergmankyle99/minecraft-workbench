services:

  postgres:
    image: postgres:16
    container_name: minecraft-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql


  backend:
    build:
      context: ./backend

    container_name: minecraft-api

    environment:
      DATABASE_URL: ${DATABASE_URL}

    ports:
      - "8000:8000"

    depends_on:
      - postgres
    env_file:
    - ./.env

  frontend:
    build:
      context: ./frontend

    container_name: minecraft-frontend

    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    ports:
      - "3000:3000"

    depends_on:
      - backend


  worker:
    build:
      context: ./worker

    container_name: minecraft-worker

    environment:
      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      - postgres


volumes:

  postgres_data: